<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Static Patterns</title>
<style>
  :root { --bg: #000; --fg: #fff; --panel: rgba(0, 0, 0, 0.75); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
  canvas { display: block; width: 100vw; height: 100vh; }
  #label, #results {
    position: fixed; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 6px;
    background: var(--panel); font: 14px/1.4 system-ui, sans-serif; color: #fff;
  }
  #results { bottom: auto; top: 12px; max-height: 80vh; overflow: auto; display: none; white-space: pre; font-family: monospace; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label"></div>
<div id="results"></div>
<script>
// Full-window test patterns drawn at device-pixel resolution, for finding which content
// brings up the static on one monitor. Move this window to that monitor, press F.
//   Right / Space / click: next    Left: previous    S: static seen on this pattern
//   C: clean on this pattern       A: animate (shift by 1 px per frame)    F: fullscreen
//   H: hide this label             R: results list
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const label = document.getElementById('label');
const results = document.getElementById('results');
let index = 0, animate = false, offset = 0;
const verdict = {};

function rng(seed) {                       // small deterministic PRNG, same picture every time
  let s = seed >>> 0;
  return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
}
function solid(color) { return (w, h) => { ctx.fillStyle = color; ctx.fillRect(0, 0, w, h); }; }
function text(bg, fg) {
  return (w, h, dpr, off) => {
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    const size = Math.round(14 * dpr), line = Math.round(size * 1.25);
    ctx.font = `${size}px monospace`; ctx.fillStyle = fg; ctx.textBaseline = 'top';
    const r = rng(7), chars = 'abcdefghijklmnopqrstuvwxyz0123456789-_./:=+[]{}()<>#$%&*';
    const cols = Math.ceil(w / (size * 0.6)) + 2;
    for (let y = -line + (off % line); y < h; y += line) {
      let s = '';
      const n = Math.floor(r() * cols);
      for (let i = 0; i < n; i++) s += r() < 0.15 ? ' ' : chars[Math.floor(r() * chars.length)];
      ctx.fillText(s, Math.round(4 * dpr), y);
    }
  };
}
function pixels(fn) {                       // fn(x, y, off) -> [r, g, b]
  return (w, h, dpr, off) => {
    const img = ctx.createImageData(w, h), d = img.data;
    for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i += 4) {
      const p = fn(x, y, off); d[i] = p[0]; d[i + 1] = p[1]; d[i + 2] = p[2]; d[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  };
}
const noiseTable = (() => { const r = rng(42), t = new Uint8Array(1 << 20); for (let i = 0; i < t.length; i++) t[i] = r() * 256; return t; })();

const patterns = [
  ['black', solid('#000000')],
  ['white', solid('#ffffff')],
  ['mid grey #808080', solid('#808080')],
  ['terminal: light text on Breeze dark #232627', text('#232627', '#fcfcfc')],
  ['file manager: dark text on light #fcfcfc', text('#fcfcfc', '#232627')],
  ['red', solid('#ff0000')],
  ['green', solid('#00ff00')],
  ['blue', solid('#0000ff')],
  ['1 px checkerboard black/white', pixels((x, y, o) => ((x + y + o) & 1) ? [255, 255, 255] : [0, 0, 0])],
  ['1 px vertical lines black/white', pixels((x, y, o) => ((x + o) & 1) ? [255, 255, 255] : [0, 0, 0])],
  ['1 px horizontal lines black/white', pixels((x, y, o) => ((y + o) & 1) ? [255, 255, 255] : [0, 0, 0])],
  ['2 px checkerboard black/white', pixels((x, y, o) => (((x + o) >> 1) + (y >> 1)) & 1 ? [255, 255, 255] : [0, 0, 0])],
  ['1 px columns #aaaaaa / #555555 (bits 1010 / 0101)', pixels((x, y, o) => ((x + o) & 1) ? [0xaa, 0xaa, 0xaa] : [0x55, 0x55, 0x55])],
  ['horizontal grey ramp', (w, h) => { const g = ctx.createLinearGradient(0, 0, w, 0); g.addColorStop(0, '#000'); g.addColorStop(1, '#fff'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); }],
  ['colour bars', (w, h) => { const c = ['#c0c0c0', '#c0c000', '#00c0c0', '#00c000', '#c000c0', '#c00000', '#0000c0']; c.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(Math.floor(i * w / c.length), 0, Math.ceil(w / c.length), h); }); }],
  ['random noise', pixels((x, y, o) => { const i = ((y * 4099 + x * 3 + o * 13) * 3) & 0xfffff; return [noiseTable[i], noiseTable[(i + 1) & 0xfffff], noiseTable[(i + 2) & 0xfffff]]; })],
];

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(window.innerWidth * dpr), h = Math.round(window.innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  patterns[index][1](w, h, dpr, offset);
  const v = verdict[index] ? ` [${verdict[index]}]` : '';
  label.textContent = `${index + 1}/${patterns.length} ${patterns[index][0]}${v}${animate ? ' (moving)' : ''}  ·  ` +
    `→/← next/prev · S static · C clean · A animate · F fullscreen · H hide · R results  ·  ${w}×${h} px`;
}
function showResults() {
  results.textContent = patterns.map((p, i) => `${String(i + 1).padStart(2)}  ${(verdict[i] || '-').padEnd(7)} ${p[0]}`).join('\n');
}
function step(d) { index = (index + d + patterns.length) % patterns.length; offset = 0; draw(); }
function tick() { if (animate) { offset++; draw(); requestAnimationFrame(tick); } }

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowright' || k === ' ') step(1);
  else if (k === 'arrowleft') step(-1);
  else if (k === 's' || k === 'c') { verdict[index] = k === 's' ? 'static' : 'clean'; draw(); if (results.style.display === 'block') showResults(); }
  else if (k === 'a') { animate = !animate; draw(); if (animate) requestAnimationFrame(tick); }
  else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (k === 'h') label.classList.toggle('hidden');
  else if (k === 'r') { const on = results.style.display !== 'block'; results.style.display = on ? 'block' : 'none'; if (on) showResults(); }
  else return;
  e.preventDefault();
});
canvas.addEventListener('click', () => step(1));
window.addEventListener('resize', draw);
draw();
</script>
</body>
</html>
