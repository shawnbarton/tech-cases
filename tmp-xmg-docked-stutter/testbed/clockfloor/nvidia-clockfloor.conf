# /etc/default/nvidia-clockfloor, read by /usr/local/sbin/nvidia-clockfloor.
# After editing: sudo systemctl start nvidia-clockfloor.service
# (changed values are re-applied; an invalid value releases the lock).

# 0 = pause: releases whatever was applied, and udev/timer/resume runs keep it off.
ENABLED=1

# locks      = nvidia-smi memory clock lock and/or graphics clock floor
# powermizer = NVML PowerMizer mode through nv-powermizer
METHOD=locks

# MEM_LOCK locks the memory clock at exactly this value: a floor AND a cap.
# 6001 MHz was accepted on this laptop before. Use the maximum (e.g. 8001) to
# avoid capping games, at a higher idle power. Empty = no memory lock.
MEM_LOCK=6001
# GR_MIN raises the graphics clock floor only (no cap). Empty = no floor.
GR_MIN=

# Only for METHOD=powermizer: consistent (locks to base clocks, also a cap)
# or max (prefer maximum performance)
PM_MODE=consistent
